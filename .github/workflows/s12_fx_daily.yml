name: S12 FX/Gold Daily Signal
on:
  schedule:
    - cron: '0 0 * * 1-6'   # 00:00 UTC Mon-Sat = 08:00 MYT Mon-Sat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance pandas numpy scikit-learn
      - run: python -m s12_fx.data
      - run: python -m s12_fx.signal --output signals
      - run: |
          git config user.name "s12-bot"
          git config user.email "s12-bot@users.noreply.github.com"
          git add signals/ data/fx/
          git diff --quiet && git diff --staged --quiet || git commit -m "S12 FX signal $(date -u +%Y-%m-%d)"
          git push
